# ─────────────────────────────────────────────────────────────────────────────
#  Nginx Production Config — Dilshaj Infotech Chatbot
#  Reverse proxy for FastAPI with SSL, gzip, rate limiting
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/x-font-ttf font/opentype image/svg+xml;

    # ── Rate limiting zones ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=chat:10m rate=10r/m;

    # ── Upstream FastAPI ───────────────────────────────────────────────────────
    upstream fastapi {
        server app:8000;
        keepalive 32;
    }

    # ── HTTP server (Accessible without SSL for initial setup) ────────────────
    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # ── Static files ──────────────────────────────────────────────────────
        # Nginx serves static files directly for better performance
        location /static/ {
            root /app;
            index index.html;
            autoindex off;
            expires 7d;
            add_header Cache-Control "public, immutable";
            # Ensure correct MIME types are set
            include /etc/nginx/mime.types;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
        }

        # ── API & SSE Streaming ───────────────────────────────────────────────
        location /api/v1/chatbot/chat/stream {
            limit_req zone=chat burst=5 nodelay;
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
        }
    }

    # ── HTTPS server (COMMENTED OUT - Enable after adding certs to docker/ssl/)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     location / { proxy_pass http://fastapi; }
    # }
}
