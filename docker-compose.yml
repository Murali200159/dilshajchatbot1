# ─────────────────────────────────────────────────────────────────────────────
#  Dilshaj Infotech Chatbot — Production-Ready Docker Compose (GPU Optimized)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. FastAPI Application ──────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dilshaj_app
    restart: unless-stopped
    env_file: .env.production
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      MONGO_URI: mongodb://mongo:27017
      ENVIRONMENT: production
      MEM0_VECTOR_STORE_URL: http://qdrant:6333
    # Removed public port 8000 for security; traffic now flows through Nginx
    expose:
      - "8000"
    volumes:
      - faiss_data:/app/data/faiss_index
      - qdrant_local:/app/data/qdrant_db_v3
      - ./data/company_docs:/app/data/company_docs:ro
    depends_on:
      ollama:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - chatbot_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  # ── 2. Ollama (LLM + GPU) ──────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: dilshaj_ollama
    restart: unless-stopped
    # Removed public port 11434 for security
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_FLASH_ATTENTION: "1"
    networks:
      - chatbot_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  # ── 3. Ollama Model Puller ────────────────────────────────────────────────
  ollama_puller:
    image: curlimages/curl:latest
    container_name: dilshaj_ollama_puller
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - chatbot_net
    entrypoint: >
      sh -c "
        echo 'Pulling models...' &&
        curl -s -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{\"name\": \"llama3.1\"}' &&
        curl -s -X POST http://ollama:11434/api/pull -H 'Content-Type: application/json' -d '{\"name\": \"nomic-embed-text\"}' &&
        echo 'All models ready!'
      "


  # ── 4. MongoDB ──────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: dilshaj_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: company_app
    # Only accessible via Localhost (SSH Tunnel) or internal network
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - chatbot_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"


  # ── 5. Qdrant (Vector DB) ──────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: dilshaj_qdrant
    restart: unless-stopped
    # Only accessible via Localhost (SSH Tunnel) or internal network
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - chatbot_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"


  # ── 6. Nginx ───────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dilshaj_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - chatbot_net


volumes:
  ollama_models:
  mongo_data:
  qdrant_data:
  qdrant_local:
  faiss_data:

networks:
  chatbot_net:
    driver: bridge
    name: dilshaj_network